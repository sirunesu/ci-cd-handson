name: Rollback

on:
  workflow_dispatch:
    inputs:
      sha:
        description: '戻したいcommitのSHA'
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 指定したコミットに移動
        run: git checkout ${{ github.event.inputs.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::271434548535:role/github-actions-deploy-role
          aws-region: ap-northeast-1

      - name: Sync to S3 (rollback)
        run: aws s3 sync ./public s3://${{ secrets.S3_BUCKET_NAME }}/ --delete

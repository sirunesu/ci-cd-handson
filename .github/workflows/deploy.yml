name: Deploy

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::271434548535:role/github-actions-deploy-role
          aws-region: ap-northeast-1

      - name: Sync to S3
        run: aws s3 sync ./public s3://<ci-cd-handson-sirunesu>/ --delete
